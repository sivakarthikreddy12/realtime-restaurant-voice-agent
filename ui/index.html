<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Burger House - Voice Ordering</title>
  <style>
    :root {
      --bg: #f6efe3;
      --card: #fffaf2;
      --card-2: #fffdf8;
      --ink: #2b2118;
      --muted: #7b6a56;
      --line: #e7d8c3;
      --accent: #b23a2b;
      --accent-dark: #8f2c20;
      --gold: #d99a2b;
      --green: #2f8f5b;
      --blue: #2f6f9f;
      --amber: #b7791f;
      --violet: #7652a8;
      --red: #b42318;
      --shadow: 0 18px 50px rgba(81, 52, 27, 0.12);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, rgba(217, 154, 43, 0.18), transparent 34rem),
        radial-gradient(circle at 100% 100%, rgba(178, 58, 43, 0.10), transparent 30rem),
        var(--bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 28px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .logo {
      width: 48px; height: 48px; border-radius: 14px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #fff; font-weight: 800; letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(178, 58, 43, 0.28);
      flex: 0 0 auto;
    }
    h1 { font-size: 1.28rem; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.83rem; }
    .status {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 9px 13px; border: 1px solid var(--line);
      border-radius: 999px; background: rgba(255, 250, 242, 0.78);
      color: var(--muted); font-size: 0.83rem; font-weight: 600;
      white-space: nowrap; backdrop-filter: blur(8px);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(183,121,31,0.12); }
    .dot.ready { background: var(--green); box-shadow: 0 0 0 4px rgba(47,143,91,0.14); }
    .dot.listening { background: var(--blue); box-shadow: 0 0 0 4px rgba(47,111,159,0.14); }
    .dot.thinking { background: var(--amber); box-shadow: 0 0 0 4px rgba(183,121,31,0.14); }
    .dot.speaking { background: var(--violet); box-shadow: 0 0 0 4px rgba(118,82,168,0.14); }
    .dot.error { background: var(--red); box-shadow: 0 0 0 4px rgba(180,35,24,0.14); }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
    .card {
      background: rgba(255, 250, 242, 0.93);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .chat-card {
      height: min(720px, calc(100vh - 150px));
      min-height: 500px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 13px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 9px; }
    .chat::-webkit-scrollbar-thumb { background: #dbc7ac; border-radius: 999px; }
    .msg { display: flex; gap: 9px; max-width: 88%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }
    .msg.system { align-self: center; max-width: 94%; }
    .msg.tool { align-self: flex-start; max-width: 92%; }
    .avatar {
      width: 29px; height: 29px; border-radius: 9px; flex: 0 0 auto;
      display: grid; place-items: center; font-size: 0.68rem; font-weight: 800;
      background: #eadbc6; color: #6b5843; margin-top: 2px;
    }
    .msg.user .avatar { background: var(--accent); color: white; }
    .bubble {
      padding: 11px 14px; border-radius: 15px;
      background: var(--card-2); border: 1px solid #eddfca;
      line-height: 1.45; font-size: 0.94rem;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .msg.user .bubble { background: var(--accent); border-color: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
    .msg.assistant .bubble { border-bottom-left-radius: 5px; }
    .msg.system .bubble {
      background: transparent; border: 1px dashed #d9c6aa; color: var(--muted);
      font-size: 0.8rem; text-align: center; padding: 8px 13px;
    }
    .msg.tool .bubble {
      background: #fff2dc; border-color: #eed5aa; color: #6d4c17;
      font-size: 0.78rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 8px 11px;
    }
    .receipt {
      align-self: flex-start; max-width: 92%;
      border: 1px solid #cfe5d5; background: #f2fbf4;
      border-radius: 15px; padding: 13px 15px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    }
    .receipt h3 { margin: 0 0 4px; font-size: 0.95rem; color: #21633d; }
    .receipt p { margin: 3px 0; color: #3d6550; font-size: 0.82rem; }
    .receipt .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
    .controls {
      display: flex; gap: 9px; padding: 13px;
      border-top: 1px solid var(--line); background: rgba(255, 251, 244, 0.9);
    }
    .mic {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid #d9c2a4; background: #fff8ea; color: #6b4e2f;
      padding: 0 15px; border-radius: 12px; font: inherit; font-weight: 700;
      cursor: pointer; min-width: 102px; justify-content: center;
      transition: 150ms ease;
    }
    .mic:hover:not(:disabled) { background: #f8edda; transform: translateY(-1px); }
    .mic.active {
      background: var(--blue); border-color: var(--blue); color: #fff;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(47,111,159,0.15); } }
    .mic svg { width: 16px; height: 16px; }
    #textInput {
      flex: 1; min-width: 0; padding: 12px 14px;
      border-radius: 12px; border: 1px solid #dccbb2;
      background: #fffdf9; color: var(--ink); font: inherit;
      outline: none; transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    #textInput:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(217,154,43,0.14); }
    button { font: inherit; }
    .send {
      border: 0; border-radius: 12px; padding: 0 20px;
      background: var(--ink); color: #fff; font-weight: 700; cursor: pointer;
      transition: 150ms ease;
    }
    .send:hover:not(:disabled) { background: #463527; transform: translateY(-1px); }
    button:disabled, input:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
    .hint { padding: 0 15px 12px; color: var(--muted); font-size: 0.76rem; }
    .side { display: flex; flex-direction: column; gap: 14px; }
    .side .card { padding: 16px; }
    .side h2 { margin: 0 0 11px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
    .cart { display: flex; flex-direction: column; gap: 7px; min-height: 52px; }
    .cart.empty { color: #9a8870; font-size: 0.84rem; justify-content: center; }
    .cart-line { display: flex; justify-content: space-between; gap: 12px; font-size: 0.85rem; }
    .cart-line span:first-child { color: #51402d; }
    .cart-line span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 11px; font-size: 0.86rem; color: var(--muted); }
    .total strong { color: var(--ink); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .tools { color: var(--muted); font-size: 0.78rem; }
    .tool-name { color: var(--ink); font-weight: 700; margin-bottom: 5px; }
    .tools pre {
      margin: 0; max-height: 170px; overflow: auto; white-space: pre-wrap;
      background: #fbf1e1; border: 1px solid #ead7bb; border-radius: 9px;
      padding: 8px; font-size: 0.7rem; line-height: 1.35;
    }
    .ghost {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      padding: 10px 13px; border-radius: 11px; cursor: pointer; font-weight: 600;
    }
    .ghost:hover { background: rgba(255,255,255,0.55); color: var(--ink); }
    .order {
      width: 100%; margin-top: 11px; border-color: #cfe5d5;
      background: #f2fbf4; color: #21633d; font-weight: 700;
    }
    .order:hover:not(:disabled) { background: #e5f7e9; color: #174d2d; }
    .foot { margin-top: 14px; color: #9a8870; font-size: 0.73rem; text-align: center; }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .chat-card { height: 68vh; min-height: 430px; }
      .side { display: grid; grid-template-columns: 1fr 1fr; }
      .side .ghost { grid-column: 1 / -1; }
    }
    @media (max-width: 540px) {
      .app { width: calc(100% - 20px); padding-top: 14px; }
      header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .msg { max-width: 96%; }
      .side { grid-template-columns: 1fr; }
      .controls { flex-wrap: wrap; }
      .mic { min-width: 92px; }
      #textInput { flex-basis: 100%; order: -1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">DB</div>
        <div>
          <h1>Demo Burger House</h1>
          <p>Realtime voice ordering demo</p>
        </div>
      </div>
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <main>
      <section class="card chat-card">
        <div id="chat" class="chat" aria-live="polite"></div>
        <div class="controls">
          <button id="micBtn" class="mic" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"></path>
            </svg>
            <span id="micLabel">Talk</span>
          </button>
          <input id="textInput" type="text" placeholder="Type an order or question..." autocomplete="off" disabled>
          <button id="sendBtn" class="send" type="button" disabled>Send</button>
        </div>
        <div class="hint">Speak or type. Try “What’s on the menu?” or “Two cheeseburgers and a Coke.”</div>
      </section>

      <aside class="side">
        <section class="card">
          <h2>Your cart</h2>
          <div id="cart" class="cart empty">Your cart is empty.</div>
          <div class="total"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
          <button id="mockOrderBtn" class="ghost order" type="button" disabled>Create mock order</button>
        </section>
        <section class="card">
          <h2>Last tool</h2>
          <div id="tools" class="tools">Waiting for a request...</div>
        </section>
        <button id="newSessionBtn" class="ghost" type="button">New session</button>
      </aside>
    </main>

    <div class="foot">Demo only. Mock orders are never sent to Toast or a real restaurant.</div>
  </div>

  <script>
    const state = {
      ws: null,
      ready: false,
      reconnect: true,
      assistantBubble: null,
      assistantText: "",
      micOn: false,
      mic: null,
      playCtx: null,
      nextPlayTime: 0,
      cartItems: [],
    };

    const chatEl = document.getElementById("chat");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const micBtn = document.getElementById("micBtn");
    const micLabel = document.getElementById("micLabel");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const cartEl = document.getElementById("cart");
    const subtotalEl = document.getElementById("subtotal");
    const toolsEl = document.getElementById("tools");
    const newSessionBtn = document.getElementById("newSessionBtn");
    const mockOrderBtn = document.getElementById("mockOrderBtn");

    const workletSource = `
      class PCMRecorder extends AudioWorkletProcessor {
        constructor() {
          super();
          this.buffer = [];
          this.length = 0;
        }
        process(inputs) {
          const channel = inputs[0] && inputs[0][0];
          if (channel && channel.length) {
            this.buffer.push(new Float32Array(channel));
            this.length += channel.length;
            if (this.length >= 2048) {
              const merged = new Float32Array(this.length);
              let offset = 0;
              for (const part of this.buffer) {
                merged.set(part, offset);
                offset += part.length;
              }
              this.port.postMessage(merged, [merged.buffer]);
              this.buffer = [];
              this.length = 0;
            }
          }
          return true;
        }
      }
      registerProcessor("pcm-recorder", PCMRecorder);
    `;

    function setStatus(text, kind) {
      statusText.textContent = text;
      statusDot.className = "dot" + (kind ? " " + kind : "");
    }

    function setControlsEnabled(enabled) {
      micBtn.disabled = !enabled;
      textInput.disabled = !enabled;
      sendBtn.disabled = !enabled;
    }

    function scrollChat() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addMessage(role, text, label) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = label || (role === "user" ? "YOU" : role === "assistant" ? "DB" : "SYS");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      scrollChat();
      return bubble;
    }

    function addSystem(text) {
      addMessage("system", text, "SYS");
    }

    function addToolMessage(text) {
      const wrap = document.createElement("div");
      wrap.className = "msg tool";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "FN";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      scrollChat();
    }

    function resetAssistantBubble() {
      state.assistantBubble = null;
      state.assistantText = "";
    }

    function appendAssistant(text) {
      if (!text) return;
      if (!state.assistantBubble) {
        state.assistantBubble = addMessage("assistant", "", "DB");
      }
      state.assistantText += text;
      state.assistantBubble.textContent = state.assistantText;
      scrollChat();
    }

    function finalizeAssistant(text) {
      if (text && !state.assistantText.trim()) {
        state.assistantText = text;
        if (!state.assistantBubble) {
          state.assistantBubble = addMessage("assistant", text, "DB");
        } else {
          state.assistantBubble.textContent = text;
        }
      }
      resetAssistantBubble();
    }

    function money(value) {
      const number = Number(value);
      return "$" + (Number.isFinite(number) ? number : 0).toFixed(2);
    }

    function renderCart(items, subtotal) {
      cartEl.replaceChildren();
      state.cartItems = Array.isArray(items) ? items : [];
      mockOrderBtn.disabled = state.cartItems.length === 0;
      if (state.cartItems.length === 0) {
        cartEl.className = "cart empty";
        cartEl.textContent = "Your cart is empty.";
        subtotalEl.textContent = money(subtotal || 0);
        return;
      }
      cartEl.className = "cart";
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "cart-line";
        const name = document.createElement("span");
        name.textContent = `${item.quantity}x ${item.name}`;
        const price = document.createElement("span");
        price.textContent = money(item.line_total);
        row.appendChild(name);
        row.appendChild(price);
        cartEl.appendChild(row);
      }
      subtotalEl.textContent = money(subtotal);
    }

    function renderReceipt(result) {
      const card = document.createElement("div");
      card.className = "receipt";
      const title = document.createElement("h3");
      title.textContent = "Mock order created";
      const id = document.createElement("p");
      id.className = "id";
      id.textContent = result.order_id || "DEMO-UNKNOWN";
      const total = document.createElement("p");
      total.textContent = `Subtotal ${money(result.subtotal)} - no real order was placed.`;
      const note = document.createElement("p");
      note.textContent = "The cart has been cleared.";
      card.appendChild(title);
      card.appendChild(id);
      card.appendChild(total);
      card.appendChild(note);
      chatEl.appendChild(card);
      scrollChat();
    }

    function renderToolResult(name, result) {
      toolsEl.replaceChildren();
      const label = document.createElement("div");
      label.className = "tool-name";
      label.textContent = name;
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(result, null, 2).slice(0, 1600);
      toolsEl.appendChild(label);
      toolsEl.appendChild(pre);

      if (result && Array.isArray(result.cart)) {
        renderCart(result.cart, result.subtotal);
      } else if (result && Array.isArray(result.items) && name === "get_cart") {
        renderCart(result.items, result.subtotal);
      }
      if (result && result.status === "MOCK_ORDER_CREATED") {
        renderReceipt(result);
        renderCart([], 0);
      }
      if (result && result.error) {
        addToolMessage(`${name}: ${result.error}`);
      }
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function ensurePlaybackContext() {
      if (!state.playCtx) {
        try {
          state.playCtx = new AudioContext({ sampleRate: 16000 });
        } catch {
          state.playCtx = new AudioContext();
        }
      }
      if (state.playCtx.state === "suspended") {
        state.playCtx.resume();
      }
      return state.playCtx;
    }

    function playAudio(base64) {
      if (!base64) return;
      const ctx = ensurePlaybackContext();
      const bytes = base64ToBytes(base64);
      const count = Math.floor(bytes.length / 2);
      if (!count) return;
      const samples = new Int16Array(bytes.buffer, bytes.byteOffset, count);
      const buffer = ctx.createBuffer(1, count, 16000);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < count; i += 1) data[i] = samples[i] / 32768;
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      const start = Math.max(ctx.currentTime + 0.03, state.nextPlayTime);
      source.start(start);
      state.nextPlayTime = start + buffer.duration;
    }

    function assistantSpeaking() {
      if (!state.playCtx) return false;
      return state.nextPlayTime > state.playCtx.currentTime + 0.04;
    }

    function scheduleReadyStatus() {
      const ctx = state.playCtx;
      if (!ctx) {
        setStatus("Ready", "ready");
        return;
      }
      const delay = Math.max(0, (state.nextPlayTime - ctx.currentTime) * 1000 + 180);
      window.setTimeout(() => {
        if (!assistantSpeaking()) setStatus("Ready", "ready");
      }, delay);
    }

    function send(payload) {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        addSystem("Not connected to the voice backend.");
        return false;
      }
      state.ws.send(JSON.stringify(payload));
      return true;
    }

    function downsampleTo16k(samples, inputRate) {
      if (inputRate === 16000) return samples;
      const ratio = inputRate / 16000;
      const length = Math.max(1, Math.floor(samples.length / ratio));
      const output = new Float32Array(length);
      for (let i = 0; i < length; i += 1) {
        const position = i * ratio;
        const index = Math.floor(position);
        const fraction = position - index;
        const first = samples[index] || 0;
        const second = samples[index + 1] !== undefined ? samples[index + 1] : first;
        output[i] = first + (second - first) * fraction;
      }
      return output;
    }

    function floatToPcm16(samples, inputRate) {
      const resampled = downsampleTo16k(samples, inputRate);
      const out = new Int16Array(resampled.length);
      for (let i = 0; i < resampled.length; i += 1) {
        const value = Math.max(-1, Math.min(1, resampled[i]));
        out[i] = value < 0 ? value * 0x8000 : value * 0x7fff;
      }
      return out;
    }

    async function startMic() {
      if (!state.ready) return;
      ensurePlaybackContext();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
        let ctx;
        try {
          ctx = new AudioContext({ sampleRate: 16000 });
        } catch {
          ctx = new AudioContext();
        }
        await ctx.resume();
        const moduleUrl = URL.createObjectURL(new Blob([workletSource], { type: "application/javascript" }));
        await ctx.audioWorklet.addModule(moduleUrl);
        URL.revokeObjectURL(moduleUrl);

        const source = ctx.createMediaStreamSource(stream);
        const node = new AudioWorkletNode(ctx, "pcm-recorder");
        const sink = ctx.createGain();
        sink.gain.value = 0;
        source.connect(node);
        node.connect(sink);
        sink.connect(ctx.destination);

        node.port.onmessage = (event) => {
          if (!state.micOn || assistantSpeaking()) return;
          const pcm = floatToPcm16(event.data, ctx.sampleRate);
          if (pcm.length) {
            send({ type: "audio", audio: bytesToBase64(new Uint8Array(pcm.buffer)) });
          }
        };

        state.mic = { stream, source, node, sink, ctx };
        state.micOn = true;
        micBtn.classList.add("active");
        micLabel.textContent = "Stop";
        setStatus("Listening...", "listening");
      } catch (error) {
        addSystem(`Microphone error: ${error.message || error}`);
        setStatus("Microphone unavailable", "error");
      }
    }

    async function stopMic() {
      if (!state.micOn) return;
      state.micOn = false;
      const mic = state.mic;
      state.mic = null;
      micBtn.classList.remove("active");
      micLabel.textContent = "Talk";
      try {
        if (mic) {
          mic.stream.getTracks().forEach((track) => track.stop());
          mic.source.disconnect();
          mic.node.disconnect();
          mic.sink.disconnect();
          await mic.ctx.close();
        }
      } catch (error) {
        console.debug("Mic cleanup", error);
      }
      send({ type: "audio_end" });
      setStatus("Thinking...", "thinking");
    }

    function connect() {
      setControlsEnabled(false);
      state.ready = false;
      setStatus("Connecting...", "thinking");
      const ws = new WebSocket(`ws://${location.host}/ws`);
      state.ws = ws;

      ws.onmessage = (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }
        switch (message.type) {
          case "ready":
            state.ready = true;
            setControlsEnabled(true);
            setStatus("Ready", "ready");
            addSystem("Connected. Ask about the menu or tap Talk.");
            break;
          case "listening":
            setStatus("Listening...", "listening");
            break;
          case "thinking":
            resetAssistantBubble();
            setStatus("Thinking...", "thinking");
            break;
          case "user_transcript":
            addMessage("user", message.text, "YOU");
            break;
          case "assistant_delta":
            appendAssistant(message.text);
            setStatus("Speaking...", "speaking");
            break;
          case "assistant_done":
            finalizeAssistant(message.text);
            break;
          case "audio":
            playAudio(message.audio);
            setStatus("Speaking...", "speaking");
            break;
          case "audio_done":
            scheduleReadyStatus();
            break;
          case "tool_start":
            addToolMessage(`${message.name}(${JSON.stringify(message.arguments)})`);
            setStatus(`Using ${message.name}...`, "thinking");
            break;
          case "tool_result":
            renderToolResult(message.name, message.result);
            break;
          case "response_done":
            finalizeAssistant();
            scheduleReadyStatus();
            break;
          case "notice":
            addSystem(message.text);
            break;
          case "error":
            if ((message.message || "").includes("Another browser session")) {
              state.reconnect = false;
            }
            addSystem(`Error: ${message.message}`);
            setStatus("Error", "error");
            break;
          default:
            break;
        }
      };

      ws.onclose = () => {
        state.ready = false;
        setControlsEnabled(false);
        if (state.micOn) stopMic();
        setStatus("Disconnected", "error");
        if (state.reconnect) {
          window.setTimeout(connect, 2500);
        }
      };

      ws.onerror = () => {
        setStatus("Connection error", "error");
      };
    }

    function sendText() {
      const text = textInput.value.trim();
      if (!text || !state.ready) return;
      ensurePlaybackContext();
      addMessage("user", text, "YOU");
      send({ type: "text", text });
      textInput.value = "";
      resetAssistantBubble();
      setStatus("Thinking...", "thinking");
    }

    micBtn.addEventListener("click", () => {
      if (state.micOn) stopMic();
      else startMic();
    });
    sendBtn.addEventListener("click", sendText);
    textInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendText();
    });
    mockOrderBtn.addEventListener("click", () => {
      if (state.cartItems.length === 0) return;
      const confirmed = window.confirm(
        "Create a mock order for this cart? This is a demo and no real order will be placed."
      );
      if (!confirmed) return;
      mockOrderBtn.disabled = true;
      send({ type: "mock_order" });
      setStatus("Creating mock receipt...", "thinking");
    });
    newSessionBtn.addEventListener("click", () => window.location.reload());

    addSystem("Connecting to the local voice assistant...");
    connect();
  </script>
</body>
</html>
